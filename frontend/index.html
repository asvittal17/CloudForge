<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudForge — Cloud Infrastructure Control Plane</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cloudforge_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#030507;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
          <div style="width:48px;height:48px;border-radius:12px;background:rgba(45,212,191,0.1);display:flex;align-items:center;justify-content:center;">
            <div style="width:24px;height:24px;border:2px solid #2dd4bf;border-top-color:transparent;border-radius:50%;animation:cf-spin 0.8s linear infinite;"></div>
          </div>
          <p style="font-size:12px;font-weight:500;color:#525e6e;font-family:system-ui,-apple-system,sans-serif;">Loading CloudForge...</p>
        </div>
      </div>
      <style>@keyframes cf-spin{to{transform:rotate(360deg);}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
