name: CI

on:
  push:
    branches: [master, UI, "audit/**"]
  pull_request:

# Least privilege: the pipeline only needs to read the repository.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      # Applies stay disabled in CI: the gate keeps every terraform
      # apply subprocess from running. Enabling real deployments is a
      # deliberate, environment-specific configuration change with its
      # own cloud credentials — never a CI property.
      CLOUDFORGE_ALLOW_TERRAFORM_APPLY: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Run test suite
        run: python -m pytest -q

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
